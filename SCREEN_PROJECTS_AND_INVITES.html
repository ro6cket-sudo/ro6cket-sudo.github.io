<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои проекты и приглашения — StudentTracker</title>
    <link rel="stylesheet" href="SCREEN_PROJECTS_AND_INVITES_STYLE.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header class="top-bar">
        <span class="window-dots">
            <svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path id="Circle" d="M8 4C8 1.79086 6.20914 0 4 0C1.79086 0 0 1.79086 0 4C0 6.20914 1.79086 8 4 8C6.20914 8 8 6.20914 8 4Z" fill="#4A4A4A"/>
            </svg>
            <svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path id="Circle" d="M8 4C8 1.79086 6.20914 0 4 0C1.79086 0 0 1.79086 0 4C0 6.20914 1.79086 8 4 8C6.20914 8 8 6.20914 8 4Z" fill="#4A4A4A"/>
            </svg>
            <svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path id="Circle" d="M8 4C8 1.79086 6.20914 0 4 0C1.79086 0 0 1.79086 0 4C0 6.20914 1.79086 8 4 8C6.20914 8 8 6.20914 8 4Z" fill="#4A4A4A"/>
            </svg>
        </span>
        <span class="window-title">Мои проекты и приглашения</span>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="logo">
                <strong class="logo-title">StudentTracker</strong>
                <span class="logo-subtitle">Баг-трекер</span>
            </div>

            <nav class="navigation">
                <a class="nav-link current-page" href="SCREEN_PROJECTS_AND_INVITES.html">[•] Мои проекты</a>
            </nav>

            <p class="profile" id="profile-username">@...</p>
        </aside>

        <main class="content">
            <header class="content-header">
                <h1 class="page-title">
                    Список проектов и приглашений
                </h1>
                <button class="button create-project" id="open-create-project" type="button">
                    + Создать проект
                </button>
            </header>

            <section class="invitations" id="invitations-section" hidden>
                <h2 id="invitations-title">Входящие приглашения (0)</h2>
                <div id="invitations-list"></div>
            </section>

            <section class="projects">
                <h2>Активные проекты</h2>
                <div id="projects-list">
                    <p class="response-status">Загрузка проектов...</p>
                </div>
            </section>
        </main>
    </div>

    <dialog class="modal-dialog" id="create-project-dialog">
        <div class="modal-header">
            <h3>Новый проект</h3>
            <button class="button dark" id="close-create-project" type="button">✕</button>
        </div>
        <form class="modal-form" id="create-project-form">
            <label class="modal-field">
                Название проекта *
                <input class="field" name="name" type="text" required placeholder="Например: StudyHelper">
            </label>
            <label class="modal-field">
                Описание
                <textarea class="field" name="description" placeholder="Краткое описание учебного проекта"></textarea>
            </label>
            <label class="modal-field">
                Версия ПО *
                <input class="field" name="softwareVersion" type="text" required value="v0.1.0">
            </label>
            <label class="modal-field">
                Git Remote URL *
                <input class="field" name="gitRemoteUrl" type="url" required value="https://github.com/edu/new-project.git">
            </label>
            <div class="modal-field">
                Ваши роли в проекте:
                <div class="modal-checkboxes">
                    <label><input type="checkbox" name="roles" value="Leader" checked> Руководитель</label>
                    <label><input type="checkbox" name="roles" value="Developer" checked> Разработчик</label>
                    <label><input type="checkbox" name="roles" value="Tester"> Тестировщик</label>
                </div>
            </div>
            <p class="form-error" id="create-project-error" hidden></p>
            <div class="modal-actions">
                <button class="button dark" id="cancel-create-project" type="button">Отмена</button>
                <button class="button" type="submit">Создать</button>
            </div>
        </form>
    </dialog>

    <script src="./api.js"></script>
    <script src="./SCREEN_PROJECTS_AND_INVITES_SCRIPT.js"></script>
</body>
</html>
